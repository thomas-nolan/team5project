# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build and test core with JaCoCo
      run: cd Game && ./gradlew build :core:jacocoTestReport :core:checkstyleMain :core:checkstyleTest || true

    - name: Upload JaCoCo artifact
      uses: actions/upload-artifact@v4.3.1
      with:
        name: jacoco-report
        path: Game/core/build/reports/jacoco/test/html/
        retention-days: 7

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4.3.1
      with:
        name: Escape-From-Uni-jar
        path: Game/lwjgl3/build/libs/*.jar
        retention-days: 7

    - name: Upload checkStyle test
      uses: actions/upload-artifact@v4.3.1
      with:
        name: checkstyle-report
        path: Game/core/build/reports/checkstyle/
        retention-days: 7
        
  release:
    runs-on: ubuntu-24.04
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Download binary artifact
      uses: actions/download-artifact@v4
      with:
        name: Escape-From-Uni-jar
        
    - name: Create Github Release
      uses: softprops/action-gh-release@v1
      with:
        files: Escape-From-Uni-jar

